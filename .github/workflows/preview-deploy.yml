name: PR Preview Deploy (via CI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to run preview for'
        required: false
        default: 'feat/monorepo-skeleton'

jobs:
  preview-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: Install
        run: |
          set -euo pipefail
          echo "Attempting pnpm install with --frozen-lockfile (preferred)"
          if pnpm install --frozen-lockfile; then
            echo "pnpm install succeeded with frozen-lockfile"
          else
            echo "Frozen-lockfile install failed; retrying with --no-frozen-lockfile"
            pnpm install --no-frozen-lockfile
          fi
      - name: Build
        run: pnpm turbo build --filter=@hq-operations/web
      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Ensure system tools available in CI (vercel for deploy)
          sudo apt-get update
          sudo apt-get install -y jq
          pnpm add -w -D vercel@latest || npm i -g vercel@latest
          # Pull project settings so Vercel knows which project to target (creates .vercel/project)
          if [ -n "$VERCEL_ORG_ID" ]; then
            npx vercel pull --yes --cwd apps/web --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          else
            npx vercel pull --yes --cwd apps/web --token "$VERCEL_TOKEN"
          fi
          # Debug: show pulled settings and build outputs
          echo "=== apps/web/.vercel ==="
          ls -la apps/web/.vercel || true
          echo "=== apps/web/.next ==="
          ls -la apps/web/.next || true
          echo "=== project.json ==="
          cat apps/web/.vercel/project.json || true
          # Build and deploy inside the app directory to avoid path duplication
          pushd apps/web
          echo "PWD: $(pwd)"
          ls -la
          echo "Using vercel.json:"
          cat vercel.json || true
          # vercel build moved below (see nested-path workaround)
          # Workaround: make sure the CLI has the prebuilt files at the nested path it expects
          NESTED_DIR="apps/web/apps/web/.next"
          echo "Ensuring nested path exists: $NESTED_DIR"
          rm -rf apps/web/apps/web || true
          mkdir -p apps/web/apps/web/.next
          # Create placeholder so any tooling that probes for the nested .next doesn't fail early
          touch apps/web/apps/web/.next/.placeholder || true

          # Run vercel build (this will populate .next)
          npx vercel build --local-config vercel.json

          # Copy actual build outputs into the nested path (use rsync if available for correctness)
          if command -v rsync >/dev/null 2>&1; then
            echo "Syncing .next/ -> $NESTED_DIR/"
            rsync -a .next/ $NESTED_DIR/
          else
            echo "Copying .next -> $NESTED_DIR"
            cp -a .next $NESTED_DIR || true
          fi

          echo "Nested dir listing:"
          ls -la $NESTED_DIR || ls -la apps/web/apps/web || true

          echo "Locate any routes-manifest.json files in repo (for debugging):"
          find . -type f -name 'routes-manifest.json' -print -exec ls -la {} \; || true

          if [ -f $NESTED_DIR/routes-manifest.json ]; then
            echo "routes-manifest found in nested path"
          else
            echo "routes-manifest missing in nested path; attempting to copy from .next"
            if [ -f .next/routes-manifest.json ]; then
              cp .next/routes-manifest.json $NESTED_DIR/ || true
              ls -la $NESTED_DIR || true
            fi
          fi

          # Deploy the prebuilt output from the app directory (write URL to repo-root preview_url.txt)
          npx vercel deploy --token "$VERCEL_TOKEN" --prebuilt --local-config vercel.json --yes > ../preview_url.txt 2>&1 || DEPLOY_STATUS=$?

          if [ "${DEPLOY_STATUS:-0}" -ne 0 ]; then
            echo "App-dir deploy failed (status $DEPLOY_STATUS). Showing last 200 lines of vercel output:" || true
            tail -n 200 ../preview_url.txt || true

            echo "Trying fallback: deploy from repo root using apps/web/vercel.json"
            popd || true

            # Fallback deploy from repo root using explicit local-config path
            npx vercel deploy --token "$VERCEL_TOKEN" --prebuilt --local-config apps/web/vercel.json --yes > preview_url_root.txt 2>&1 || (echo "Fallback deploy failed; showing last 200 lines:"; tail -n 200 preview_url_root.txt; exit 1)

            echo "Fallback deploy output (last 50 lines):"
            tail -n 50 preview_url_root.txt || true

            # Move fallback output into preview_url.txt so downstream steps can read it
            mv preview_url_root.txt preview_url.txt || true
          else
            popd || true
          fi

          # show captured URL for logs
          cat preview_url.txt
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('preview_url.txt','utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployment: ${url}`
            });
