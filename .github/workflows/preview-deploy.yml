name: PR Preview Deploy (via CI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to run preview for'
        required: false
        default: 'feat/monorepo-skeleton'

jobs:
  preview-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm turbo build --filter=@hq-operations/web
      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Ensure system tools available in CI (vercel for deploy)
          sudo apt-get update
          sudo apt-get install -y jq
          pnpm add -w -D vercel@latest || npm i -g vercel@latest
          # Pull project settings so Vercel knows which project to target (creates .vercel/project)
          if [ -n "$VERCEL_ORG_ID" ]; then
            npx vercel pull --yes --cwd apps/web --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          else
            npx vercel pull --yes --cwd apps/web --token "$VERCEL_TOKEN"
          fi
          # Build the project locally at repo root using the app's local config so paths are correct
          npx vercel build --local-config apps/web/vercel.json
          # Deploy the prebuilt output from repo root (points to the same local-config)
          npx vercel deploy --token "$VERCEL_TOKEN" --prebuilt --local-config apps/web/vercel.json --yes > preview_url.txt
          # show captured URL for logs
          cat preview_url.txt
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('preview_url.txt','utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployment: ${url}`
            });
